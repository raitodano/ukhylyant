name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]   # publishing a release on github.com builds and attaches the APK
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already ships the Android SDK ($ANDROID_HOME); just make sure
      # the needed platform/build-tools are present and their licenses accepted.
      - name: Prepare Android SDK
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk ukhylyant.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ukhylyant-apk
          path: ukhylyant.apk

      - name: Attach APK to GitHub Release (on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ukhylyant.apk
