name: Build APK

# Every push to main builds the APK.
# If versionName in android/app/build.gradle has no release yet, the workflow
# creates tag v<versionName> + a GitHub Release with the APK attached.
# So shipping a new version = bump versionCode/versionName, update RELEASE_NOTES.md, push.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already ships the Android SDK ($ANDROID_HOME); just make sure
      # the needed platform/build-tools are present and their licenses accepted.
      - name: Prepare Android SDK
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Read app version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android/app/build.gradle | head -n 1)
          test -n "$V" || { echo "versionName not found"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "Release v$V already exists, will only build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"; echo "Release v$V will be created."
          fi

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk ukhylyant.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ukhylyant-apk
          path: ukhylyant.apk

      - name: Publish GitHub Release for a new version
        if: github.ref == 'refs/heads/main' && steps.ver.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Ухилянт v${{ steps.ver.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: ukhylyant.apk
          make_latest: true
