plugins {
    id 'com.android.application'
}

android {
    namespace 'ua.ukhylyant.game'
    compileSdk 34

    defaultConfig {
        applicationId 'ua.ukhylyant.game'
        minSdk 24
        targetSdk 34
        versionCode 10
        versionName '4.1'
    }

    // Shared, NON-SECRET debug key (standard "android" passwords) so that local and CI
    // builds have the same signature and the app can be updated without reinstalling.
    // For a store release, create your own keystore and keep it out of git.
    signingConfigs {
        shared {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.shared }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    // The game lives in /web (single source); it is packed into the APK assets as-is.
    sourceSets {
        main { assets.srcDirs = ['../../web'] }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
